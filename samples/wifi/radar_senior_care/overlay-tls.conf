#
# MQTT-over-TLS (+ optional broker auth) overlay for nRF54L + nRF70.
#
# Usage:
#   1. Put your broker CA certificate (PEM) in src/certs/ca_cert.h
#      (server/broker/gen_certs.sh generates one for the bundled demo broker).
#   2. Build:
#        west build -p -b nrf54lm20dk/nrf54lm20a/cpuapp --sysbuild \
#          samples/wifi/radar_senior_care -- \
#          -Dradar_senior_care_SHIELD="nrf7002eb2" \
#          -DEXTRA_CONF_FILE="overlay-tls.conf"
#
# The crypto settings mirror samples/net/mqtt/tls-nrf54l-nrf70.conf.

# --- Application TLS/auth options ---
CONFIG_RADAR_CARE_MQTT_TLS=y
CONFIG_RADAR_CARE_BROKER_PORT=8883
CONFIG_RADAR_CARE_MQTT_TLS_PEER_VERIFY=2
# Must match a CN/SAN in the broker certificate:
CONFIG_RADAR_CARE_MQTT_TLS_HOSTNAME="care-broker"
# Optional broker auth (must match the broker password file):
CONFIG_RADAR_CARE_MQTT_USERNAME="room-device"
CONFIG_RADAR_CARE_MQTT_PASSWORD="change-me"

# --- TLS credential store (CA registered at runtime from src/certs/ca_cert.h) ---
CONFIG_TLS_CREDENTIALS_BACKEND_VOLATILE=y
CONFIG_NET_SOCKETS_TLS_MAX_CONTEXTS=1

# --- nRF Security / mbed TLS ---
CONFIG_PSA_CRYPTO=y
CONFIG_MBEDTLS=y
CONFIG_MBEDTLS_ENABLE_HEAP=y
CONFIG_MBEDTLS_HEAP_SIZE=48000
CONFIG_MBEDTLS_SSL_KEEP_PEER_CERTIFICATE=n
CONFIG_MBEDTLS_SSL_SERVER_NAME_INDICATION=y
CONFIG_MBEDTLS_DECLARE_PRIVATE_IDENTIFIERS=y
CONFIG_MBEDTLS_MD_C=y
CONFIG_MBEDTLS_HMAC_DRBG_C=y
CONFIG_MBEDTLS_SHA256_C=y
CONFIG_MBEDTLS_ECP_C=y
CONFIG_MBEDTLS_CTR_DRBG_C=y
CONFIG_MBEDTLS_AES_C=y
CONFIG_MBEDTLS_ENTROPY_C=y
CONFIG_MBEDTLS_RSA_C=y
# MPI size limit to handle ~4 kB RSA certificates.
CONFIG_MBEDTLS_MPI_MAX_SIZE=512
CONFIG_PSA_WANT_KEY_TYPE_RSA_KEY_PAIR_IMPORT=y
CONFIG_PSA_WANT_KEY_TYPE_RSA_KEY_PAIR_EXPORT=y
CONFIG_PSA_WANT_KEY_TYPE_RSA_KEY_PAIR_GENERATE=y
# ECDHE key exchange used during the TLS handshake.
CONFIG_PSA_WANT_ALG_ECDH=y
CONFIG_PSA_WANT_ALG_ECDSA=y
CONFIG_PSA_WANT_ECC_SECP_R1_256=y
CONFIG_PSA_WANT_ECC_SECP_R1_384=y
