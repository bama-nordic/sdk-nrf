# Lab/prototype broker config: anonymous access on the LAN.
# For production, enable TLS + per-device ACLs (see DESIGN.md §7.5).

listener 1883
allow_anonymous true

# Optional MQTT-over-WebSocket listener.
listener 9001
protocol websockets

persistence true
persistence_location /mosquitto/data/
