#
# TLS + password-authenticated MQTT broker.
# Generate certs/passwd first with gen_certs.sh, then run with
# docker-compose.tls.yml (see README.md §TLS).

# --- TLS listener ---
listener 8883
cafile /mosquitto/certs/ca.crt
certfile /mosquitto/certs/server.crt
keyfile /mosquitto/certs/server.key
tls_version tlsv1.2
# Server-auth TLS only (devices verify the broker; broker authenticates devices
# with username/password). Set to true for mutual-TLS deployments.
require_certificate false

# --- Authentication ---
allow_anonymous false
password_file /mosquitto/config/passwd

# Optional MQTT-over-TLS WebSocket listener for browser clients.
listener 9001
protocol websockets
cafile /mosquitto/certs/ca.crt
certfile /mosquitto/certs/server.crt
keyfile /mosquitto/certs/server.key

persistence true
persistence_location /mosquitto/data/
